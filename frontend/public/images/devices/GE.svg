<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="geBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#geBg)"/>
  <!-- anchor posts -->
  <rect x="30" y="80" width="14" height="96" rx="3" fill="white"/>
  <rect x="212" y="80" width="14" height="96" rx="3" fill="white"/>
  <!-- spring / zigzag rod -->
  <polyline points="44,128 72,104 100,152 128,104 156,152 184,104 212,128"
            fill="none" stroke="white" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- left arrow (contraction) -->
  <path d="M 80 200 L 50 200 M 50 200 L 64 188 M 50 200 L 64 212"
        stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right arrow (expansion) -->
  <path d="M 176 200 L 206 200 M 206 200 L 192 188 M 206 200 L 192 212"
        stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- measurement text underneath -->
  <text x="128" y="210" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" opacity="0.95">Δ</text>
</svg>
