<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#flowBg)"/>
  <!-- left pipe flange -->
  <rect x="20" y="80" width="18" height="96" rx="3" fill="white"/>
  <!-- right pipe flange -->
  <rect x="218" y="80" width="18" height="96" rx="3" fill="white"/>
  <!-- pipe body -->
  <rect x="38" y="96" width="180" height="64" fill="none" stroke="white" stroke-width="6" rx="4"/>
  <!-- meter dial on pipe -->
  <circle cx="128" cy="128" r="26" fill="white"/>
  <circle cx="128" cy="128" r="22" fill="none" stroke="#DB2777" stroke-width="2.5"/>
  <!-- dial hand -->
  <line x1="128" y1="128" x2="142" y2="115" stroke="#DB2777" stroke-width="3" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="3" fill="#DB2777"/>
  <!-- flow arrows (before + after meter) -->
  <path d="M 58 128 L 84 128 M 84 128 L 76 120 M 84 128 L 76 136"
        stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 172 128 L 198 128 M 198 128 L 190 120 M 198 128 L 190 136"
        stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- droplets underneath suggesting water -->
  <circle cx="88" cy="196" r="4" fill="white" opacity="0.75"/>
  <circle cx="128" cy="204" r="5" fill="white" opacity="0.85"/>
  <circle cx="168" cy="196" r="4" fill="white" opacity="0.75"/>
</svg>
