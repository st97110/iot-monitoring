<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="waterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <clipPath id="wellInside">
      <rect x="80" y="56" width="96" height="160" rx="4"/>
    </clipPath>
  </defs>
  <rect width="256" height="256" fill="url(#waterBg)"/>
  <!-- ground line -->
  <line x1="32" y1="60" x2="76" y2="60" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="180" y1="60" x2="224" y2="60" stroke="white" stroke-width="3" opacity="0.6"/>
  <!-- well casing -->
  <rect x="76" y="52" width="104" height="168" rx="6" fill="none" stroke="white" stroke-width="6"/>
  <!-- water inside (clipped to well) -->
  <g clip-path="url(#wellInside)">
    <path d="M 72 140 Q 100 128 128 140 T 184 140 L 184 220 L 72 220 Z" fill="white" opacity="0.85"/>
    <path d="M 72 140 Q 100 128 128 140 T 184 140" fill="none" stroke="white" stroke-width="3"/>
    <path d="M 72 158 Q 100 150 128 158 T 184 158" fill="none" stroke="white" stroke-width="2" opacity="0.45"/>
  </g>
  <!-- tick marks on left side of well -->
  <line x1="66" y1="90" x2="76" y2="90" stroke="white" stroke-width="2" opacity="0.55"/>
  <line x1="66" y1="115" x2="76" y2="115" stroke="white" stroke-width="2" opacity="0.55"/>
  <line x1="66" y1="140" x2="80" y2="140" stroke="white" stroke-width="3"/>
  <line x1="66" y1="175" x2="76" y2="175" stroke="white" stroke-width="2" opacity="0.55"/>
</svg>
