<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- calendar 外框 -->
  <rect x="3" y="5" width="18" height="16" rx="2"/>
  <line x1="8" y1="3" x2="8" y2="7"/>
  <line x1="16" y1="3" x2="16" y2="7"/>
  <line x1="3" y1="9" x2="21" y2="9"/>
  <!-- 4 列 × 7 點 grid（代表整月）-->
  <g fill="currentColor" stroke="none" opacity="0.85">
    <!-- row 1 -->
    <circle cx="5.5"  cy="11.5" r="0.7"/>
    <circle cx="7.85" cy="11.5" r="0.7"/>
    <circle cx="10.2" cy="11.5" r="0.7"/>
    <circle cx="12.0" cy="11.5" r="0.7"/>
    <circle cx="13.8" cy="11.5" r="0.7"/>
    <circle cx="16.15" cy="11.5" r="0.7"/>
    <circle cx="18.5" cy="11.5" r="0.7"/>
    <!-- row 2 -->
    <circle cx="5.5"  cy="14"   r="0.7"/>
    <circle cx="7.85" cy="14"   r="0.7"/>
    <circle cx="10.2" cy="14"   r="0.7"/>
    <circle cx="12.0" cy="14"   r="0.7"/>
    <circle cx="13.8" cy="14"   r="0.7"/>
    <circle cx="16.15" cy="14"   r="0.7"/>
    <circle cx="18.5" cy="14"   r="0.7"/>
    <!-- row 3 -->
    <circle cx="5.5"  cy="16.5" r="0.7"/>
    <circle cx="7.85" cy="16.5" r="0.7"/>
    <circle cx="10.2" cy="16.5" r="0.7"/>
    <circle cx="12.0" cy="16.5" r="0.7"/>
    <circle cx="13.8" cy="16.5" r="0.7"/>
    <circle cx="16.15" cy="16.5" r="0.7"/>
    <circle cx="18.5" cy="16.5" r="0.7"/>
    <!-- row 4 -->
    <circle cx="5.5"  cy="19"   r="0.7"/>
    <circle cx="7.85" cy="19"   r="0.7"/>
    <circle cx="10.2" cy="19"   r="0.7"/>
    <circle cx="12.0" cy="19"   r="0.7"/>
    <circle cx="13.8" cy="19"   r="0.7"/>
  </g>
</svg>
