<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- calendar 外框 -->
  <rect x="3" y="5" width="18" height="16" rx="2"/>
  <line x1="8" y1="3" x2="8" y2="7"/>
  <line x1="16" y1="3" x2="16" y2="7"/>
  <line x1="3" y1="9" x2="21" y2="9"/>
  <!-- 一整列七格的 highlighted 橫條（代表一週）-->
  <rect x="4.5" y="13" width="15" height="3.5" rx="0.6"
        fill="currentColor" stroke="none" opacity="0.85"/>
  <!-- 七格分隔白線（讓人看出是 7 天）-->
  <g stroke="white" stroke-width="0.5">
    <line x1="6.6" y1="13" x2="6.6" y2="16.5"/>
    <line x1="8.7" y1="13" x2="8.7" y2="16.5"/>
    <line x1="10.8" y1="13" x2="10.8" y2="16.5"/>
    <line x1="12.9" y1="13" x2="12.9" y2="16.5"/>
    <line x1="15.0" y1="13" x2="15.0" y2="16.5"/>
    <line x1="17.1" y1="13" x2="17.1" y2="16.5"/>
  </g>
</svg>
