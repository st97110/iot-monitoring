name: Download Backup Data

on:
  workflow_dispatch:
    inputs:
      instrument_group:
        description: '請選擇要下載的儀器組'
        required: true
        type: choice
        options:
        - T8-WISE   # 台8線 WISE 儀器
        - T8-TDR    # 台8線 TDR 儀器
        # - OTHER-WISE # 未來可以擴展
        default: 'T8-WISE'

jobs:
  download-and-package:
    runs-on: self-hosted # 指定在您的自建 Runner 上運行

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install python-dateutil

      # --- 新增的關鍵步驟 ---
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_ed25519 # 或者 id_rsa，取決於你的金鑰類型
          known_hosts: 'just-a-placeholder-so-we-dont-run-ssh-keyscan' # 我們已經手動信任了，所以這裡隨便填

      - name: Run download script
        id: download_script
        run: |
          python scripts/download_data.py ${{ github.event.inputs.instrument_group }}

      - name: Upload backup as artifact
        if: steps.download_script.outputs.zip_filename
        uses: actions/upload-artifact@v4
        with:
          name: backup-data-${{ github.event.inputs.instrument_group }}
          path: ${{ steps.download_script.outputs.zip_filename }}