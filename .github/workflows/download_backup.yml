name: Download Backup Data

on:
  workflow_dispatch:
    inputs:
      instrument_group:
        description: '請選擇要下載的儀器組'
        required: true
        type: choice
        options:
          - T8-WISE   # 台8線 WISE 儀器
          - T8-TDR    # 台8線 TDR 儀器
          # - OTHER-WISE # 未來可以擴展
        default: 'T8-WISE'

jobs:
  download-and-package:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install python-dateutil influxdb-client pandas

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_ed25519
          known_hosts: 'just-a-placeholder-so-we-dont-run-ssh-keyscan'

      - name: Run download script
        id: download_script
        env:
          TZ: Asia/Taipei
          INFLUX_URL: ${{ secrets.INFLUX_URL }}
          INFLUX_ORG: ${{ secrets.INFLUX_ORG }}
          INFLUX_TOKEN_WISE: ${{ secrets.INFLUX_TOKEN_WISE }}
          INFLUX_BUCKET_WISE: ${{ secrets.INFLUX_BUCKET_WISE }}
        run: |
          python scripts/download_data.py ${{ github.event.inputs.instrument_group }}

      # Upload the per-device CSVs directly. `actions/upload-artifact@v4`
      # always zips the upload once, so passing the directory (not a .zip)
      # avoids the double-zip problem the previous version produced.
      - name: Upload backup as artifact
        if: steps.download_script.outputs.output_dir
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.download_script.outputs.artifact_name }}
          path: ${{ steps.download_script.outputs.output_dir }}
          # Keep it for 30 days. Bump / lower to taste.
          retention-days: 30
          if-no-files-found: error
